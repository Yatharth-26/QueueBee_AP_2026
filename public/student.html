<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Queue - QueueBee</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <h1 id="welcome">Hello 👋</h1>
    <p class="muted">This page refreshes every 5 seconds.</p>

    <div id="message" class="hidden"></div>

    <!-- Current ticket (filled by student.js) -->
    <section id="ticket-section"></section>

    <!-- Available services -->
    <h2 class="section-title">Join a queue</h2>
    <div id="locations" class="grid"></div>

    <!-- Old tickets -->
    <h2 class="section-title">My ticket history</h2>
    <div class="card">
      <div style="max-width: 220px; margin-bottom: 12px">
        <select id="history-filter">
          <option value="">All statuses</option>
          <option value="COMPLETED">Completed</option>
          <option value="CANCELLED">Cancelled</option>
          <option value="WAITING">Waiting</option>
          <option value="CALLED">Called</option>
        </select>
      </div>
      <div id="history"></div>
      <div class="pagination">
        <button class="btn btn-light btn-small" id="prev-page">Previous</button>
        <span id="page-info" class="muted"></span>
        <button class="btn btn-light btn-small" id="next-page">Next</button>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
