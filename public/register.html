<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - QueueBee</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <div class="card form-card">
      <h2>Create your account 🎓</h2>
      <p class="muted">Student accounts only. Staff accounts are created by the admin.</p>

      <div id="message" class="hidden"></div>

      <form id="register-form" novalidate>
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@college.edu" />

        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" placeholder="Choose a password" />

        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" placeholder="Type the password again" />

        <div class="form-actions">
          <button type="submit" class="btn">Register</button>
        </div>
      </form>

      <p class="muted" style="margin-top: 14px">
        Already registered? <a href="/login.html">Log in</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
