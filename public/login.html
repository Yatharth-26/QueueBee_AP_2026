<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - QueueBee</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <div class="card form-card">
      <h2>Welcome back 👋</h2>
      <p class="muted">Log in to join a queue or manage one.</p>

      <div id="message" class="hidden"></div>

      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@college.edu" />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" />

        <div class="form-actions">
          <button type="submit" class="btn">Login</button>
        </div>
      </form>

      <p class="muted" style="margin-top: 14px">
        New student? <a href="/register.html">Create an account</a>
      </p>

      <div class="demo-box">
        <strong>Demo accounts</strong> <span class="muted">(password: password123)</span>
        <div class="demo-buttons">
          <button type="button" class="btn btn-light btn-small" data-email="student@queuebee.edu">Student</button>
          <button type="button" class="btn btn-light btn-small" data-email="staff@queuebee.edu">Staff</button>
          <button type="button" class="btn btn-light btn-small" data-email="admin@queuebee.edu">Admin</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
