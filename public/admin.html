<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - QueueBee</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <h1>Admin Dashboard 📊</h1>
    <p class="muted">Overview of users and queues.</p>

    <div id="message" class="hidden"></div>

    <!-- Statistics cards -->
    <div id="stats" class="grid"></div>

    <!-- Locations -->
    <h2 class="section-title">Locations</h2>
    <div class="card">
      <div id="locations-table"></div>

      <h3 style="margin-top: 20px">Add a new location</h3>
      <form id="location-form" class="inline-form" novalidate>
        <div>
          <label for="location-name">Name</label>
          <input type="text" id="location-name" placeholder="e.g. Hostel Office" />
        </div>
        <div>
          <label for="location-description">Description</label>
          <input type="text" id="location-description" placeholder="Short description" />
        </div>
        <div>
          <label for="location-minutes">Avg minutes / student</label>
          <input type="number" id="location-minutes" value="5" min="1" max="120" />
        </div>
        <div>
          <button type="submit" class="btn" style="width: 100%">Add location</button>
        </div>
      </form>
    </div>

    <!-- Users -->
    <h2 class="section-title">Users</h2>
    <div class="card">
      <div style="max-width: 220px; margin-bottom: 12px">
        <select id="role-filter">
          <option value="">All roles</option>
          <option value="STUDENT">Students</option>
          <option value="STAFF">Staff</option>
          <option value="ADMIN">Admins</option>
        </select>
      </div>
      <div id="users-table"></div>
      <div class="pagination">
        <button class="btn btn-light btn-small" id="prev-page">Previous</button>
        <span id="page-info" class="muted"></span>
        <button class="btn btn-light btn-small" id="next-page">Next</button>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
