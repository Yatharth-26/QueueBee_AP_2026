<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Desk - QueueBee</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <h1>Staff Desk 🧑‍💼</h1>
    <p class="muted">Choose your counter, call the next student and mark them as completed. Refreshes every 5 seconds.</p>

    <div id="message" class="hidden"></div>

    <div class="card">
      <label for="location-select" style="margin-top: 0">Counter / location</label>
      <select id="location-select"></select>
    </div>

    <div id="queue-area"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/staff.js"></script>
</body>
</html>
